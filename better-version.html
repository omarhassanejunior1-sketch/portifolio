<!DOCTYPE html>
<html lang="en">
<head>
    <title>Use locally generated ideographs</title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js'></script>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>
<body>
    
    <div id="map"></div>

<script>
    const el = document.createElement('img');
    el.src = "bus.svg"; // your image URL
    el.style.width = '48px';
    el.style.height = '48px';
    el.style.cursor = 'pointer';
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/bright',
        center: [32.40030973248349, -26.018693909315516], // ✅ [longitude, latitude] — Maputo, Mozambique
        zoom: 18,
        attributionControl: false, // Map name 👈 disables it
        localIdeographFontFamily: '"Apple LiSung", serif',
        bearing: 90
    });
    function deviceOrientationHandler() {
        window.addEventListener("deviceorientation", (event) => {
            //document.getElementById('mobile-orientation').textContent = `Alpha (compass direction): ${event.alpha}° <br> Beta (front/back tilt): ${event.beta}° <br> Gamma (left/right tilt): ${event.gamma}°`;
            document.getElementById('mobile-orientation').textContent = `Alpha (compass direction): ${event.alpha}° `;
            if(map.easeTo()) {
                map.easeTo({ bearing: parseInt(event.alpha), duration: 1000 });
            } else {
                console.warn("Map rotation not supported in this Leaflet version.");
            }
            console.log("Alpha (compass direction):", event.alpha);
            console.log("Beta front/back tilt:", event.beta);
            console.log("Gamma (left/right):", event.gamma);
        });
    }
    // 3. Default blue marker
    new maplibregl.Marker({element: el,rotation: 0, rotationAlignment: 'map' })
    .setLngLat([-26.019464268539704, 32.40052826494995].reverse()) // ✅ [longitude, latitude] — Maputo, Mozambique
    .setPopup(
        new maplibregl.Popup().setHTML('<b>Maputo</b>')
    )
    .addTo(map)
</script>
</body>
</html>

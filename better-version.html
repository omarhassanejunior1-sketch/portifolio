<!DOCTYPE html>
<html lang="en">
<head>
  <title>Better Version of wutivi library</title>
  <meta property="og:description" content="Use extrusions to display buildings' height in 3D." />
  <meta property="og:created" content="2025-06-25" />
  <meta charset='utf-8'>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css' />
  <script src='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js'></script>
  <style>
    body { margin: 0; padding: 0; }
    html, body, #map { height: 100vh; width: 100%; }
    .btn_container {
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(134, 134, 134, 0.8);
        padding: 10px;
        border-radius: 5px;
        font-family: Arial, sans-serif;
    }

    button {
        background: #ffffff;
        
        border: none;
        padding: 5px 15px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        color: #333;
        margin-right: 10px;
    }

    .header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 2;
        background: #ffffff;

    }
    span{
        color: #333;
    }
    #student-marker {
        width: 64px;
        height: 64px;
        background-color: #ffffff;
        background-image: url('aiony.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        border-radius: 50%;
        border: 2px solid #ffffff;
    }
  </style>
</head>
<body>
    <div class="header">
        <div class="btn_container">
            <button id="route">Route</button>
            <button id="start">Start Tracking</button>
            <span id="location"></span>
        </div>
        <div id="statusEl"></div>
        <span id="bearing">Map bearing</span>
    </div>
    <div id="map"></div>
    <script>
        const DEST   = [32.390776798423644, -26.01502328365628];
        var markerRotation = 0
        let watchId      = null;
        let lastPosition = null;
        let routingControl = null;
        var statusEl = document.getElementById('statusEl');
        const map = new maplibregl.Map({
            style: `https://tiles.openfreemap.org/styles/bright`,
            
            center: [ 32.40054676936335,-26.019396124063835],
            zoom: 18,
            pitch: 0, // x-axis tilt or x rotation 
            bearing: 0, // z-axis (rotation)
            container: 'map',
            canvasContextAttributes: {antialias: true}
        });
        
        //Main Marker (Arrow icon)
        const img = document.createElement("img");
        img.src = "Vector.svg";
        img.width = 96/2;
        img.height = 96;

        const marker = new maplibregl.Marker({
            element: img,
            rotationAlignment: 'map',
            setRotation: map.getBearing || null
        })
        .setLngLat([ 32.40054676936335,-26.019396124063835])
        .addTo(map);
        // Student Marker (Circle icon)
        const studentElement = document.createElement("div");
        studentElement.id="student-marker";
        const studentMarker = new maplibregl.Marker({
            element: studentElement,
            rotationAlignment: 'map'
        })
        .setLngLat([ 32.40075929135938, -26.0187987991407])
        .addTo(map);


        //
        function deviceOrientationHandler() {
            window.addEventListener("deviceorientation", (event) => {
                //document.getElementById('mobile-orientation').textContent = `Alpha (compass direction): ${event.alpha}° <br> Beta (front/back tilt): ${event.beta}° <br> Gamma (left/right tilt): ${event.gamma}°`;
                /*document.getElementById('mobile-orientation').textContent = `Beta(X - 180° ) (compass direction): ${Math.floor(event.beta)}° `;
                if(map.setBearing) {
                    map.setBearing(Math.floor(event.beta));
                } else {
                    console.warn("Map rotation not supported in this Leaflet version.");
                }
                console.log("Alpha (compass direction):", event.alpha);
                console.log("Beta front/back tilt:", event.beta);
                console.log("Gamma (left/right):", event.gamma);*/
                if(marker) {
                    marker.setRotation(Math.floor(event.alpha)-90*(-1));
                    
                    document.getElementById("bearing").textContent = `Marker - alpha: ${Math.floor(event.alpha)}° Beta: ${Math.floor(event.beta)}° Gamma: ${Math.floor(event.gamma)}°`;
                    if(Math.floor(event.alpha) == 90 || Math.floor(event.alpha) == 270 || Math.floor(event.alpha) == 0 || Math.floor(event.alpha) == 180 || Math.floor(event.alpha) == 360) {
                        //map.setBearing(Math.floor(event.alpha));
                        map.easeTo({
                            bearing: Math.floor(event.alpha),
                            duration: 1000, // animation time in ms
                            easing: (t) => t // linear easing
                        });
                    }
                    //map.setBearing(Math.floor(event.alpha));
                }
            });
        }
        deviceOrientationHandler() 
        

        ///


        // The 'building' layer in the streets vector source contains building-height
        // data from OpenStreetMap.
    map.on('load', () => {


        //
        // Route coordinates
        const route = {
            type: 'Feature',
            geometry: {
                type: 'LineString',
                coordinates: [
                    [ 32.40054676936335 , -26.019396124063835 ],
                    DEST
                ]
            }
        };

        // Add source
        map.addSource('route', {
            type: 'geojson',
            data: route
        });

        // Add route line
        /*map.addLayer({
            id: 'route',
            type: 'line',
            source: 'route',
            layout: {
                'line-cap': 'round',
                'line-join': 'round'
            },
            paint: {
                'line-color': '#22CBEA',
                'line-width': 18
            }
        });*/
        map.moveLayer('route');
        const layers = map.getStyle().layers;

        // Find first label layer
        let labelLayerId;

        for (let i = 0; i < layers.length; i++) {

            if (
                layers[i].type === 'symbol' &&
                layers[i].layout['text-field']
            ) {
                labelLayerId = layers[i].id;
                break;
            }
        }

        // ─────────────────────────────
        // Change map colors
        // ─────────────────────────────
        layers.forEach(layer => {

            // Background
            if (layer.type === 'background') {
                map.setPaintProperty(
                    layer.id,
                    'background-color',
                    '#ffffff'
                );
            }

            // Fill layers
            if (layer.type === 'fill') {

                if (map.getPaintProperty(layer.id, 'fill-color')) {

                    map.setPaintProperty(
                        layer.id,
                        'fill-color',
                        '#262A35'
                    );
                }
            }

            // Roads
            if (layer.type === 'line' && layer.id !== 'route') {

                if (map.getPaintProperty(layer.id, 'line-color')) {

                    map.setPaintProperty(
                        layer.id,
                        'line-color',
                        '#13181C'
                    );
                }layer.type === 'line' && layer.id !== 'route'
            }

            // Labels
            if (layer.type === 'symbol') {

                if (map.getPaintProperty(layer.id, 'text-color')) {

                    map.setPaintProperty(
                        layer.id,
                        'text-color',
                        '#22CBEA'
                    );
                    map.setLayoutProperty(
                        layer.id,
                        'text-font',
                        ['Noto Sans Bold']
                    );
                    // Stroke / outline
                    map.setPaintProperty(
                        layer.id,
                        'text-halo-color',
                        '#000000'
                    );
                }
            }
        });

        // ─────────────────────────────
        // Add 3D buildings
        // ─────────────────────────────
        map.addSource('openfreemap', {
            type: 'vector',
            url: 'https://tiles.openfreemap.org/planet'
        });

        map.addLayer(
            {
                id: '3d-buildings',

                type: 'fill-extrusion',

                source: 'openfreemap',

                'source-layer': 'building',

                minzoom: 15,

                filter: ['!=', ['get', 'hide_3d'], true],

                paint: {

                    // BUILDING COLOR
                    'fill-extrusion-color': '#1F222B',

                    // BUILDING HEIGHT
                    'fill-extrusion-height': [
                        '*',
                        ['get', 'render_height'],
                        8
                    ],

                    // BUILDING BASE
                    'fill-extrusion-base': [
                        'coalesce',
                        ['get', 'render_min_height'],
                        0
                    ],

                    // transparency
                    'fill-extrusion-opacity': 0.95
                }
            },

            labelLayerId
        );

    });
        // ── Start tracking ─────────────────────────────────────
        document.getElementById('start').addEventListener('click', (e) => {
            e.preventDefault();
            alert("Start tracking clicked!");
            if (!navigator.geolocation) {
                statusEl.textContent = '⚠ Geolocalização não suportada.';
                return;
            }

            if (watchId !== null) {
                statusEl.textContent = '… Rastreamento já activo.';
                return;
            }

            statusEl.textContent = '🔍 A obter localização...';

            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    
                    //document.getElementById('mobile-speed').textContent = `Velocidade: ${pos.coords.speed || 0} m/s ou Velocidade: ${((pos.coords.speed || 0) * 3.6)} km/h`;
                    //console.log(`Speed: ${pos.coords.speed}`)
                    lastPosition = pos;
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    marker.setLngLat([lng , lat])
                    document.getElementById('location').textContent = `📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                    map.setCenter([lng , lat]);
                },
                (err) => {
                    statusEl.textContent = `⚠ Erro: ${err.message}`;

                    switch (err.code) {
                        case err.PERMISSION_DENIED:
                            statusEl.textContent = '⛔ Acesso à localização negado.';
                            break;
                        case err.POSITION_UNAVAILABLE:
                            statusEl.textContent = '⚠ Localização indisponível.';
                            break;
                        case err.TIMEOUT:
                            statusEl.textContent = '⏱ Timeout — a tentar novamente...';
                            //retryLocation();
                            break;
                    }

                    if (lastPosition) {
                        statusEl.textContent += ' (usando última posição conhecida)';
                    }
                },
                {
                    enableHighAccuracy: true,
                    timeout: 20000,
                    maximumAge: 0
                }
            );
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <title>Display buildings in 3D</title>
  <meta property="og:description" content="Use extrusions to display buildings' height in 3D." />
  <meta property="og:created" content="2025-06-25" />
  <meta charset='utf-8'>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css' />
  <script src='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js'></script>
  <style>
      body { margin: 0; padding: 0; }
      html, body, #map { height: 100vh; width: 100%; }
      .btn_container {
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 1;
        background: rgba(134, 134, 134, 0.8);
        padding: 10px;
        border-radius: 5px;
        font-family: Arial, sans-serif;
      }
      button {
        background: #ffffff;
        border: none;
        padding: 5px 15px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        color: #333;
      }
  </style>
</head>
<body>
    <div class="btn_container">
        <button id="route">Route</button>
    </div>
    <div id="map"></div>
    <script>
        const map = new maplibregl.Map({
        style: `https://tiles.openfreemap.org/styles/bright`,
        center: [ 32.40030973248349,-26.018693909315516],
        zoom: 18,
        pitch: 45,
        bearing: -17.6,
        container: 'map',
        canvasContextAttributes: {antialias: true}
        });
        //Marker
        const img = document.createElement("img");

            img.src = "bus.svg";
            img.width = 40;
            img.height = 40;

            new maplibregl.Marker({
            element: img,
            rotationAlignment: 'map'
        })
        .setLngLat([32.40054073037627,-26.019383446876837])
        .addTo(map);
        // The 'building' layer in the streets vector source contains building-height
        // data from OpenStreetMap.
        map.on('load', () => {
        // Insert the layer beneath any symbol layer.
        const layers = map.getStyle().layers;

            let labelLayerId;
            for (let i = 0; i < layers.length; i++) {
                if (layers[i].type === 'symbol' && layers[i].layout['text-field']) {
                labelLayerId = layers[i].id;
                break;
                }
        }

            map.addSource('openfreemap', {
            url: `https://tiles.openfreemap.org/planet`,
            type: 'vector',
            });

            map.addLayer(
                {
                    'id': '3d-buildings',
                    'source': 'openfreemap',
                    'source-layer': 'building',
                    'type': 'fill-extrusion',
                    'minzoom': 15,
                    'filter': ['!=', ['get', 'hide_3d'], true],
                    'paint': {
                    'fill-extrusion-color': [
                        'interpolate',
                        ['linear'],
                        ['get', 'render_height'], 0, 'lightgray', 200, 'royalblue', 400, 'lightblue'
                    ],
                    'fill-extrusion-height': [
                        'interpolate',
                        ['linear'],
                        ['zoom'],
                        15,
                        0,
                        16,
                        ['get', 'render_height']
                    ],
                    'fill-extrusion-base': ['case',
                        ['>=', ['get', 'zoom'], 16],
                        ['get', 'render_min_height'], 0
                    ]
                    }
                },
            labelLayerId
            );
        });
        navigator.geolocation.watchPosition((pos) => {

            const lng = pos.coords.longitude;
            const lat = pos.coords.latitude;

            const bearing = pos.coords.heading;

            marker.setLngLat([lng, lat]);

            img.style.transform = `rotate(${bearing}deg)`;

            map.easeTo({
                center: [lng, lat],
                bearing: bearing,
                duration: 500
            });

        });
    </script>
</body>
</html>
